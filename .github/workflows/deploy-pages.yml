name: Build and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the public snapshot on both mirrors
        run: |
          node --experimental-strip-types scripts/sync-public-feed.mjs
          cp public/data/cyberdailylog.json sites/public/data/cyberdailylog.json
          node scripts/verify-mirror.mjs
      - name: Record the checked snapshot
        run: |
          if ! git diff --quiet -- public/data/cyberdailylog.json sites/public/data/cyberdailylog.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/data/cyberdailylog.json sites/public/data/cyberdailylog.json
            git commit -m 'Refresh public portfolio snapshot'
            git push origin HEAD:main
          fi

  validate:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check production dependency advisories for PR
        if: github.event_name == 'pull_request'
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:mirror
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  validate-sites:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Install Sites locked dependencies
        run: npm ci --prefix sites
      - name: Check Sites runtime dependency advisories
        run: cd sites && npm audit --omit=dev --audit-level=high
      - name: Validate Sites real production build
        run: cd sites && npm run verify

  validate-mobile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exactly the GitHub Pages static route bundle
        run: |
          npm ci
          NEXT_TELEMETRY_DISABLED=1 npm run build
      - name: Install isolated headless QA driver (no lockfile writes or lifecycle scripts)
        run: npm install --no-save --ignore-scripts --package-lock=false playwright-core@1.64.1
      - name: Test layout and navigation in Chrome at four viewport sizes
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$CHROME_BIN" ]]; then
            echo "Chromium/Google Chrome missing: UI QA BLOCKED" >&2
            exit 69
          fi
          (cd out && python3 -m http.server 9876 --bind 127.0.0.1) > /tmp/jimblogic-qa-http.log 2>&1 &
          test_server_pid=$!
          trap 'kill "$test_server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:9876/ >/dev/null; then break; fi
            sleep 0.25
          done
          CHROME_BIN="$CHROME_BIN" node scripts/qa-viewports.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jimblogic-responsive-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
