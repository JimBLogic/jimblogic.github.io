name: Preview minimal Next.js and React security lockfile patch

on:
  push:
    branches: [feat/agent-source-router-v01]

permissions:
  contents: read

jobs:
  preview-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculate patched manifests and lockfiles with lifecycle scripts disabled
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 react@19.2.9 react-dom@19.2.9
          npm audit fix --package-lock-only --ignore-scripts
          (
            cd sites
            npm pkg set overrides.sharp=0.35.5
            npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 react@19.2.9 react-dom@19.2.9 react-server-dom-webpack@19.2.9
            npm audit fix --package-lock-only --ignore-scripts
          )
          git diff --check
      - name: Emit exact text-only patch for connector review (no write credentials)
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const patch=execFileSync('git',['diff','--no-ext-diff','--unified=0','--','package.json','package-lock.json','sites/package.json','sites/package-lock.json'],{encoding:'utf8',maxBuffer:8*1024*1024});
          console.log('SECURITY_PATCH_BEGIN');
          for(const line of patch.split('\n')) console.log('SECURITY_PATCH_LINE:'+line);
          console.log('SECURITY_PATCH_END');
          NODE
      - name: Summarize remaining production advisories (read-only)
        run: |
          npm audit --omit=dev --audit-level=high || true
          (cd sites && npm audit --omit=dev --audit-level=high || true)
